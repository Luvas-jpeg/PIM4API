services:
  postgres:
    image: postgres:17-alpine
    container_name: medishop-postgres
    cpus: ${POSTGRES_CPUS:-2.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1024m}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medishop}
      POSTGRES_USER: ${POSTGRES_USER:-medishop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medishop_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medishop} -d ${POSTGRES_DB:-medishop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medishop-api
    cpus: ${API_CPUS:-2.0}
    mem_limit: ${API_MEMORY_LIMIT:-1024m}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__KnownNetworks__0: 172.31.245.0/24
    ports:
      - "${API_PORT:-5278}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ../PIM4Front
      dockerfile: Dockerfile
    container_name: medishop-frontend
    cpus: ${FRONTEND_CPUS:-0.5}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.245.0/24
