version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /backend.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
