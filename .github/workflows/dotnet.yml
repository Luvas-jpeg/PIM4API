# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      PIM4_POSTGRES_TESTS: '1'
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci-only-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: .

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore ./backend.Tests/backend.Tests.csproj
    - name: Build
      run: dotnet build ./backend.Tests/backend.Tests.csproj --configuration Release --no-restore
    - name: Test
      run: dotnet test ./backend.Tests/backend.Tests.csproj --configuration Release --no-build --verbosity normal
    - name: Check vulnerable packages
      run: dotnet list ./backend/backend.csproj package --vulnerable --include-transitive

    # dotnet format is intentionally not blocking yet because the current
    # legacy codebase still has pre-existing formatting issues.
