# Demonstracao temporaria. Nenhum segredo deve ser gravado neste arquivo.
services:
  - type: web
    name: pim4-api-demo
    runtime: docker
    autoDeployTrigger: checksPass
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      # O Render termina TLS e redireciona HTTP para HTTPS na borda.
      - key: Https__RedirectEnabled
        value: "false"
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: MediShopAPI
      - key: Jwt__Audience
        value: MediShopFrontend
      - key: Jwt__ExpirationHours
        value: "1"
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Postgres__Host
        fromDatabase:
          name: pim4-db-demo
          property: host
      - key: Postgres__Database
        fromDatabase:
          name: pim4-db-demo
          property: database
      - key: Postgres__Username
        fromDatabase:
          name: pim4-db-demo
          property: user
      - key: Postgres__Password
        fromDatabase:
          name: pim4-db-demo
          property: password
      - key: Postgres__SslMode
        value: Require

databases:
  - name: pim4-db-demo
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    databaseName: pim4_demo
    user: pim4_demo
    ipAllowList: []